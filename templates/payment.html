<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de Pago</title>
    <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>

<body
    class="bg-gradient-to-br from-orange-400 to-orange-600 min-h-screen flex flex-col items-center justify-center p-4">
    <h1 class="text-4xl font-extrabold text-white mb-8 drop-shadow-lg">Formulario de Pago</h1>

    <a href="/"
        class="mb-6 px-6 py-3 bg-gray-700 hover:bg-gray-800 text-white font-bold rounded-lg shadow-lg transition duration-300 ease-in-out flex items-center">
        <i class="fas fa-home mr-2"></i> Volver al Inicio
    </a>

    <div id="tarjetas-section"
        class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md mb-6 text-center">
        </div>

    <div id="payment-actions-section"
        class="w-full max-w-md mb-6 hidden opacity-0 transition-opacity duration-300 ease-out">
        <button id="proceed-payment-btn"
            class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-75 transition duration-150 ease-in-out">
            Proceder al Pago
        </button>
    </div>


    <div id="formulario-tarjeta"
        class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md opacity-0 translate-y-8 pointer-events-none"
        style="display: none;">
        <form id="payment-form" class="space-y-6">
            <input type="hidden" id="card-id" name="card_id" value="">

            <div>
                <label for="payment-method" class="block text-gray-700 text-sm font-semibold mb-2">Método de
                    Pago:</label>
                <select name="payment-method" id="payment-method" required
                    class="block w-full px-4 py-2 border border-orange-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 sm:text-sm text-gray-800">
                    <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                    <option value="Tarjeta de Débito">Tarjeta de Débito</option>
                </select>
            </div>

            <div>
                <label for="card-number" class="block text-gray-700 text-sm font-semibold mb-2">Número de
                    Tarjeta:</label>
                <input type="text" name="card-number" id="card-number" required
                    class="block w-full px-4 py-2 border border-orange-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 sm:text-sm text-gray-800"
                    placeholder="XXXX XXXX XXXX XXXX">
            </div>

            <div class="flex space-x-4">
                <div class="flex-1">
                    <label for="expiry-date" class="block text-gray-700 text-sm font-semibold mb-2">Fecha de
                        Expiración (MM/AA):</label>
                    <input type="text" name="expiry-date" id="expiry-date" required
                        class="block w-full px-4 py-2 border border-orange-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 sm:text-sm text-gray-800"
                        placeholder="MM/AA" maxlength="5">
                </div>

                <div class="flex-1">
                    <label for="cvv" class="block text-gray-700 text-sm font-semibold mb-2">CVV:</label>
                    <input type="text" name="cvv" id="cvv" required
                        class="block w-full px-4 py-2 border border-orange-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 sm:text-sm text-gray-800"
                        placeholder="XXX">
                </div>
            </div>

            <button type="submit" id="submit-button"
                class="w-full bg-orange-600 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-opacity-75">
                Registrar Tarjeta
            </button>
            <button type="button" id="cancel-edit-button"
                class="w-full bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-opacity-75 mt-2 hidden">
                Cancelar Edición
            </button>
        </form>
    </div>

    <div id="mensaje"
        class="mt-6 text-center text-white font-semibold text-lg bg-orange-500 p-4 rounded-lg shadow-md opacity-0 translate-y-4">
    </div>

    <div id="payment-success-overlay"
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300 ease-out">
        <div class="bg-white p-8 rounded-xl shadow-2xl text-center max-w-sm w-full transform -translate-y-10 opacity-0 transition-all duration-300 ease-out">
            <i class="fas fa-check-circle text-green-500 text-6xl mb-4"></i>
            <h2 class="text-3xl font-bold text-gray-800 mb-4">¡Pago Exitoso!</h2>
            <p class="text-gray-700 text-lg mb-6">Tu transacción se ha completado correctamente.</p>
            <button id="close-overlay-btn"
                class="px-6 py-3 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-opacity-75">
                Cerrar
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/payment.js') }}"></script>
</body>

</html>
