<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Configuración - Josesito Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">

</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Navbar -->
    {% include 'navbar.html' %}

    <!-- Contenido Principal -->
    <div class="max-w-4xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Configuración de Cuenta</h1>

        <!-- Mensajes flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="mb-4 p-4 rounded-lg 
                bg-{{ 'red' if category == 'error' else 'green' }}-100 
                text-{{ 'red' if category == 'error' else 'green' }}-700">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <!-- Formulario de edición -->
        <form action="{{ url_for('configuracion') }}" method="POST" class="bg-white rounded-lg shadow-md p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative">
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                    <input type="text" id="nombre" name="nombre" value="{{ session.nombre }}" required
                        class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div class="relative">
                    <label for="apellidos" class="block text-sm font-medium text-gray-700 mb-1">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" value="{{ session.apellidos }}" required
                        class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div class="relative">
                    <label for="telefono" class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" value="{{ session.telefono }}"
                        class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div class="relative">
                    <label for="direccion" class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
                    <input type="text" id="direccion" name="direccion" value="{{ session.direccion }}"
                        class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
            </div>

            <div class="mt-6">
                <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded transition">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <footer class="text-center text-sm text-gray-500 py-4">
        &copy; 2024 Josesito Enterprise. Todos los derechos reservados.
    </footer>

</body>

</html>
