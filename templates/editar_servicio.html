<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Servicio</title>
    <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-orange-500">Editar Servicio</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded
                    {% if category == 'success' %} bg-green-100 text-green-700 border border-green-400
                    {% elif category == 'danger' %} bg-red-100 text-red-700 border border-red-400
                    {% else %} bg-blue-100 text-blue-700 border border-blue-400
                    {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% if servicio %}
            <form action="{{ url_for('editar_servicio', id=servicio.id) }}" method="POST" class="space-y-4">
                <input type="hidden" name="id" value="{{ servicio.id }}">

                <div>
                    <label for="service-date" class="block text-gray-700 font-semibold mb-1">Fecha</label>
                    <input type="date" id="service-date" name="fecha_servicio" value="{{ servicio.fecha_servicio }}" required
                        class="w-full border border-gray-300 rounded px-3 py-2 bg-white text-black focus:outline-none focus:ring-2 focus:ring-orange-500" />
                </div>
                <div>
                    <label for="service-vehicle" class="block text-gray-700 font-semibold mb-1">Vehículo</label>
                    <input type="text" id="service-vehicle" name="vehiculo" value="{{ servicio.vehiculo }}" required
                        class="w-full border border-gray-300 rounded px-3 py-2 bg-white text-black focus:outline-none focus:ring-2 focus:ring-orange-500"
                        placeholder="Marca y modelo del vehículo" />
                </div>
                <div>
                    <label for="service-description" class="block text-gray-700 font-semibold mb-1">Descripción</label>
                    <textarea id="service-description" name="descripcion"
                        class="w-full border border-gray-300 rounded px-3 py-2 bg-white text-black focus:outline-none focus:ring-2 focus:ring-orange-500"
                        rows="4" placeholder="Detalles del servicio realizado">{{ servicio.descripcion }}</textarea>
                </div>
                <div>
                    <label for="service-type" class="block text-gray-700 font-semibold mb-1">Tipo de Servicio</label>
                    <input type="text" id="service-type" name="tipo_servicio" value="{{ servicio.tipo_servicio }}" 
                        class="w-full border border-gray-300 rounded px-3 py-2 bg-white text-black focus:outline-none focus:ring-2 focus:ring-orange-500"
                        placeholder="Ej. Parchado de llantas">
                </div>
                <div class="flex items-center justify-between mt-6">
                    <button type="submit" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                        Guardar Cambios
                    </button>
                    <a href="{{ url_for('listado_servicios_secreto') }}" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                        Cancelar
                    </a>
                </div>
            </form>
        {% else %}
            <p class="text-center text-red-600">No se pudo cargar el servicio para editar.</p>
        {% endif %}
    </div>
</body>
</html>
