<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registrar Servicio - Josesito Enterprise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="{{ url_for('static', filename='img/icons/rueda.png') }}" type="image/png">
    
    <link rel="icon" href="/static/img/icons/rueda.png" type="image/png">
    <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">

</head>

<body class="bg-white text-black">
    <main class="max-w-3xl mx-auto px-6 py-24">
        <div class="bg-white rounded-lg p-8 shadow-md text-black">
            <h2 class="text-2xl font-semibold mb-6 text-orange-500 text-center">Registrar Servicio</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-4 p-3 rounded
                        {% if category == 'success' %} bg-green-100 text-green-700 border border-green-400
                        {% elif category == 'danger' %} bg-red-100 text-red-700 border border-red-400
                        {% else %} bg-blue-100 text-blue-700 border border-blue-400
                        {% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form id="service-form" action="{{ url_for('register_service') }}" method="POST" class="space-y-4">
                <div>
                    <label for="service-date" class="block text-gray-700 font-semibold mb-1">Fecha</label>
                    <input type="date" id="service-date" name="service-date" required
                        class="w-full border border-gray-300 rounded px-3 py-2 bg-white text-black focus:outline-none focus:ring-2 focus:ring-orange-500" />
                </div>
                <div>
                    <label for="service-vehicle" class="block text-gray-700 font-semibold mb-1">Vehículo</label>
                    <input type="text" id="service-vehicle" name="service-vehicle" required
                        class="w-full border border-gray-300 rounded px-3 py-2 bg-white text-black focus:outline-none focus:ring-2 focus:ring-orange-500"
                        placeholder="Marca y modelo del vehículo" />
                </div>
                <div>
                    <label for="service-description" class="block text-gray-700 font-semibold mb-1">Descripción</label>
                    <textarea id="service-description" name="service-description"
                        class="w-full border border-gray-300 rounded px-3 py-2 bg-white text-black focus:outline-none focus:ring-2 focus:ring-orange-500"
                        rows="4" placeholder="Detalles del servicio realizado"></textarea>
                </div>
                <input type="hidden" id="service-type" name="service-type" value="">
                <div class="flex justify-end space-x-4">
                    <a href="{{ url_for('services') }}"
                        class="px-4 py-2 rounded bg-gray-300 text-gray-700 hover:bg-gray-400 transition">Cancelar</a>
                    <button type="submit"
                        class="px-4 py-2 rounded bg-orange-500 text-white hover:bg-orange-600 transition">Registrar</button>
                </div>
            </form>
        </div>
    </main>
<script src = "/static/js/register_service.js"></script>
</body>

</html>
